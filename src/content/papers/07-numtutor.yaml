title: "Supporting Quantitative Learning with AI: The Case of the NumTutor Platform for Numerical Methods"
authors: "**João Assaoka**, Lucas Castelani Gouveia, Lucas Molinari, Luiz Leduino Salles-Neto, Thomas Pires Correia"
super_tag: "SBPO 2025"
venue: "SBPO"
year: 2025
firstAuthor: true
tldr: "Development of NumTutor, an educational web platform for Numerical Calculation integrating interactive classical methods with step-by-step convergence visualizations, didactic content, and an AI virtual tutor chatbot."
abstract: "This paper presents the development of NumTutor, an educational web platform aimed at teaching Numerical Calculation. The application integrates three main components: (i) the interactive implementation of classical numerical methods (such as bisection, Newton, and secant), accompanied by dynamic visualizations that allow the student to observe the convergence process step by step; (ii) explanatory and didactic content to theoretically support each algorithm; and (iii) a chatbot that serves as a virtual tutor, answering concept questions in natural language. The platform proves to be a promising tool to complement classes, enhancing autonomous learning in Numerical Calculation."
