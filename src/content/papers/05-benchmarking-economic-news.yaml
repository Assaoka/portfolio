title: "Benchmarking Text Classifiers for Economic News in Brazilian Portuguese: In-Domain Quality and Out-of-Distribution Generalization"
authors: "Diego Miranda, **João Assaoka**, Lilian Berton"
super_tag: "ENIAC 2026"
venue: "ENIAC"
year: 2026
firstAuthor: false
tldr: "Extensive benchmark of neural architectures evaluating both in-domain performance and out-of-distribution robustness across economic news corpora."
abstract: "Filtering economic news is an upstream triage step for finance-oriented NLP, yet for Brazilian Portuguese there is no standardised comparison of the available model families. We benchmark TF–IDF linear models, Portuguese BERT encoders (BERTimbau, FinBERT-PT-BR, NorBERTo, DeB3RTa), and instruction-tuned LLMs on a corpus of Folha de São Paulo articles, under two shared-split formulations: a binary mercado-vs-rest task and a 7+other multiclass task over editorial sections. Every system is evaluated on identical 5-fold splits with a calibrationand significance-aware protocol (Brier, ECE, Bonferroni-corrected McNemar) and a cross-validation-only selection funnel that never consults the test set. A stacking ensemble is the strongest in-domain filter (multiclass macro-F1 0.94) and BERT leads among individual models, but a TF–IDF model recovers most of that performance at one-to-two orders of magnitude lower cost and stays competitive on a zero-shot out-of-domain probe over four external corpora — the trade-off that matters for an upstream triage stage."
